# base.yaml — training config for cs336_basics/train.py (TinyStories, ~23M params)
# Override any field from the CLI:
#   uv run python -m cs336_basics.train --config configs/base.yaml --override optim.lr=1.0e-4
# Write floats as 1.0e-3, not 1e-3 (YAML 1.1 reads bare 1e-3 as a string).

model:
  vocab_size: 10000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344          # SwiGLU hidden dim (~8/3 * d_model, rounded to a multiple of 64)
  rope_theta: 10000.0
  # ablation switches
  no_rmsnorm: false   # remove every RMSNorm
  post_norm: false    # post-norm instead of pre-norm blocks
  no_rope: false      # NoPE: no positional information
  silu: false         # ungated SiLU FFN instead of SwiGLU

paths:
  vocab: data/tokenized/tinystories/vocab.pkl
  merges: data/tokenized/tinystories/merges.pkl
  train_bin: data/tokenized/tinystories/train.bin
  valid_bin: data/tokenized/tinystories/valid.bin

tokenizer:
  special_tokens: ["<|endoftext|>"]

data:
  batch_size: 32
  context_length: 256    # must match model.context_length
  device: mps            # cuda | cpu | mps

optim:
  lr: 1.0e-3             # overwritten every step by the schedule below
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8

gradient_clipping:
  max_l2_norm: 1.0
  eps: 1.0e-6

lr_schedule:
  warmup_iters: 200
  cosine_cycle_iters: 5000   # step at which cosine decay bottoms out
  min_learning_rate: 1.0e-4
  max_learning_rate: 1.0e-3

training:
  max_iters: 5000
  eval_interval: 250
  eval_iters: 9              # validation batches averaged per eval
  checkpoint_interval: 5000
  seed: 0
  device: mps                # cuda | cpu | mps

logging:
  out_dir: runs/base
  run_name: null             # defaults to a timestamp if null
